<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Mergington High School</h1>
      <h2>Extracurricular Activities</h2>
    </header>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list">
          <!-- Example activity card and template for dynamic rendering -->
          <div class="activity-card" data-activity-id="chess-club">
            <h4>Chess Club</h4>
            <p>Join us for weekly matches and strategy sessions.</p>

            <div class="participants">
              <h5>Participants</h5>
              <ul class="participant-list">
                <li class="participant">
                  <span class="participant-avatar">AL</span>
                  Alice Lowe
                </li>
                <li class="participant">
                  <span class="participant-avatar">JS</span>
                  John Smith
                </li>
              </ul>
            </div>
          </div>

          <!-- Template for app.js to clone when rendering activities -->
          <template id="activity-template">
            <div class="activity-card">
              <h4 class="activity-title"></h4>
              <p class="activity-desc"></p>
              <div class="participants">
                <h5>Participants</h5>
                <ul class="participant-list"></ul>
              </div>
            </div>
          </template>
        </div>
      </section>

      <section id="signup-container">
        <h3>Sign Up for an Activity</h3>
        <form id="signup-form">
          <div class="form-group">
            <label for="email">Student Email:</label>
            <input type="email" id="email" required placeholder="your-email@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="activity">Select Activity:</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
              <!-- Activity options will be loaded here -->
            </select>
          </div>
          <button type="submit">Sign Up</button>
        </form>
        <div id="message" class="hidden"></div>
      </section>
    </main>

    <footer>
      <p>&copy; 2023 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
